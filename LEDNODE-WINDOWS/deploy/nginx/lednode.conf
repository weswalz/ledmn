server {
  listen 80;
  server_name lednode.yourdomain.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name lednode.yourdomain.com;

  # Replace with your cert paths (LetsEncrypt example).
  ssl_certificate /etc/letsencrypt/live/lednode.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lednode.yourdomain.com/privkey.pem;

  client_max_body_size 25m;

  # Socket.IO realtime
  location /socket.io/ {
    proxy_pass http://127.0.0.1:41238/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API
  location /api/ {
    proxy_pass http://127.0.0.1:41238/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded image assets
  location /assets/ {
    proxy_pass http://127.0.0.1:41238/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js app
  location / {
    proxy_pass http://127.0.0.1:41237;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
